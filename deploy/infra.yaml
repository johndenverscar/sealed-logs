# Stand-ins for managed infrastructure: ClickHouse, an S3-compatible bucket
# (SeaweedFS, in place of a cloud object store) and a KMS (OpenBao, dev mode).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: clickhouse-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: clickhouse }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          env:
            - { name: CLICKHOUSE_USER, valueFrom: { secretKeyRef: { name: sealed-creds, key: CH_USER } } }
            - { name: CLICKHOUSE_PASSWORD, valueFrom: { secretKeyRef: { name: sealed-creds, key: CH_PASS } } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports: [{ containerPort: 9000 }, { containerPort: 8123 }]
          readinessProbe: { httpGet: { path: /ping, port: 8123 }, periodSeconds: 2 }
          volumeMounts: [{ name: data, mountPath: /var/lib/clickhouse }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: clickhouse-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: clickhouse }
spec:
  type: NodePort
  selector: { app: clickhouse }
  ports:
    - { name: native, port: 9000 }
    - { name: http, port: 8123, nodePort: 30123 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: objectstore-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: objectstore }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: objectstore } }
  template:
    metadata: { labels: { app: objectstore } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-volume.max=0"]
          ports: [{ containerPort: 8333 }]
          readinessProbe: { tcpSocket: { port: 8333 }, periodSeconds: 2 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: identities, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: objectstore-data } }
        - { name: identities, configMap: { name: objectstore-identities } }
---
apiVersion: v1
kind: Service
metadata: { name: objectstore }
spec:
  type: NodePort
  selector: { app: objectstore }
  ports: [{ name: s3, port: 8333, nodePort: 30100 }]
---
# Dev mode keeps everything in memory: if this pod restarts, the Transit master
# key is gone and every wrapped day key with it (an accidental crypto-shred).
apiVersion: apps/v1
kind: Deployment
metadata: { name: openbao }
spec:
  replicas: 1
  selector: { matchLabels: { app: openbao } }
  template:
    metadata: { labels: { app: openbao } }
    spec:
      containers:
        - name: openbao
          image: openbao/openbao:2.1.0
          args: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
          securityContext: { capabilities: { add: [IPC_LOCK] } }
          ports: [{ containerPort: 8200 }]
          readinessProbe: { httpGet: { path: /v1/sys/health, port: 8200 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: openbao }
spec:
  selector: { app: openbao }
  ports: [{ port: 8200 }]
